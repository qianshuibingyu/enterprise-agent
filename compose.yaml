services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      whatsapp-bridge:
        condition: service_started
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      DB_HOST: db
      DB_PORT: "5432"
      AUTH_ORIGIN: ${AUTH_ORIGIN:?AUTH_ORIGIN must be set to the canonical HTTPS origin}
      # WhatsApp is handled by the project-owned Baileys adapter.
      WHATSAPP_ADAPTER_URL: ${WHATSAPP_ADAPTER_URL:-http://whatsapp-bridge:8090}
      WHATSAPP_ADAPTER_TOKEN: ${WHATSAPP_ADAPTER_TOKEN:?WHATSAPP_ADAPTER_TOKEN must be set}
      WHATSAPP_AUTH_STATE_KEY: ${WHATSAPP_AUTH_STATE_KEY:-}
      WHATSAPP_CONNECT_TIMEOUT_SECONDS: ${WHATSAPP_CONNECT_TIMEOUT_SECONDS:-10}
      WHATSAPP_SEND_TIMEOUT_SECONDS: ${WHATSAPP_SEND_TIMEOUT_SECONDS:-15}
      # Gmail is handled directly through Google OAuth/API and Pub/Sub.
      GMAIL_ENABLED: ${GMAIL_ENABLED:-false}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-}
      GMAIL_PUBSUB_PROJECT: ${GMAIL_PUBSUB_PROJECT:-}
      GMAIL_PUBSUB_TOPIC: ${GMAIL_PUBSUB_TOPIC:-}
      GMAIL_PUBSUB_SUBSCRIPTION: ${GMAIL_PUBSUB_SUBSCRIPTION:-}
      GMAIL_PUBSUB_PUSH_TOKEN: ${GMAIL_PUBSUB_PUSH_TOKEN:-}
      GMAIL_SCOPES: ${GMAIL_SCOPES:-https://www.googleapis.com/auth/gmail.readonly}
      GMAIL_TIMEOUT_SECONDS: ${GMAIL_TIMEOUT_SECONDS:-8}
      GMAIL_RECONCILE_INTERVAL_SECONDS: ${GMAIL_RECONCILE_INTERVAL_SECONDS:-600}
      GMAIL_USER_ID: ${GMAIL_USER_ID:-me}
      GMAIL_CREDENTIAL_ENCRYPTION_KEY: ${GMAIL_CREDENTIAL_ENCRYPTION_KEY:-}
      # Outlook uses direct Microsoft Graph delegated read access.
      OUTLOOK_ENABLED: ${OUTLOOK_ENABLED:-false}
      OUTLOOK_TENANT_ID: ${OUTLOOK_TENANT_ID:-}
      OUTLOOK_AUTHORITY: ${OUTLOOK_AUTHORITY:-${OUTLOOK_TENANT_ID:-common}}
      OUTLOOK_CLIENT_ID: ${OUTLOOK_CLIENT_ID:-}
      OUTLOOK_CLIENT_SECRET: ${OUTLOOK_CLIENT_SECRET:-}
      OUTLOOK_REDIRECT_URI: ${OUTLOOK_REDIRECT_URI:-}
      OUTLOOK_SCOPES: ${OUTLOOK_SCOPES:-openid profile email offline_access User.Read Mail.Read}
      OUTLOOK_TIMEOUT_SECONDS: ${OUTLOOK_TIMEOUT_SECONDS:-8}
      OUTLOOK_CREDENTIAL_ENCRYPTION_KEY: ${OUTLOOK_CREDENTIAL_ENCRYPTION_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-8}


  whatsapp-inbox-permissions:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /var/lib/whatsapp-auth /var/lib/whatsapp-inbox && chown -R 10001:10001 /var/lib/whatsapp-auth /var/lib/whatsapp-inbox && chmod 0700 /var/lib/whatsapp-auth /var/lib/whatsapp-inbox"]
    volumes:
      - whatsapp_auth:/var/lib/whatsapp-auth
      - whatsapp_inbox:/var/lib/whatsapp-inbox
    restart: "no"

  whatsapp-bridge:
    restart: unless-stopped
    depends_on:
      whatsapp-inbox-permissions:
        condition: service_completed_successfully
    build:
      context: ./whatsapp-bridge
      dockerfile: Dockerfile
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      PORT: "8090"
      BACKEND_URL: http://backend:8000
      WHATSAPP_ADAPTER_TOKEN: ${WHATSAPP_ADAPTER_TOKEN:?WHATSAPP_ADAPTER_TOKEN must be set}
      WHATSAPP_AUTH_ROOT: /var/lib/whatsapp-auth
      WHATSAPP_INBOX_ROOT: /var/lib/whatsapp-inbox
      WHATSAPP_INBOX_ENCRYPTION_KEY: ${WHATSAPP_INBOX_ENCRYPTION_KEY:?WHATSAPP_INBOX_ENCRYPTION_KEY must be set}
    volumes:
      - whatsapp_auth:/var/lib/whatsapp-auth
      - whatsapp_inbox:/var/lib/whatsapp-inbox

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  whatsapp_auth:
  whatsapp_inbox:
